<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bounce Back</title>
<meta name="description" content="A private, friendly wellness companion: protein-first meals, water, rebounder workouts, supplements and goals.">
<meta name="theme-color" content="#ECE7F3">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600&family=Figtree:wght@400;600;700&family=Gloock&display=swap" rel="stylesheet">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Bounce Back">
<style>
:root{
  --bg:#ECE7F3; --card:#FFFFFF; --ink:#2A2233; --soft:#655C72; --line:#DDD5E6;
  --rose:#6B3F8F; --rose-ink:#fff; --rose-soft:#E7DCF1; --sage:#3F7A57; --sage-soft:#DDEBDD;
  --honey:#A8641F; --honey-soft:#F7E6CC; --water:#2E7FA3; --water-soft:#D9EAF2; --plum:#B4476C; --plum-soft:#F8DFE8;
  --paper:#F6EAD0; --stamp:#B7352D; --dot:rgba(107,63,143,.07);
  --shadow:0 1px 0 rgba(42,34,51,.05),0 8px 22px -12px rgba(42,34,51,.25);
  --serif:"Gloock","Iowan Old Style",Georgia,serif;
  --sans:"Figtree",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
  --hand:"Caveat","Bradley Hand","Segoe Print",cursive;
}
:root[data-theme="duckegg"]{--bg:#E3EEEC;--line:#CFDFDC;--ink:#1F2E30;--soft:#55686A;--rose:#2F6F73;--rose-soft:#D3E6E4;--plum:#B65A34;--plum-soft:#F7E0D2;--dot:rgba(47,111,115,.08)}
:root[data-theme="coffee"]{--bg:#F1E8DC;--card:#FFFCF7;--line:#E2D3BF;--ink:#2E2018;--soft:#6C5A4C;--rose:#7A4526;--rose-soft:#EEDCC8;--plum:#8F4A5E;--plum-soft:#F3DFE4;--dot:rgba(122,69,38,.07)}
:root[data-theme="rose"]{--bg:#F6ECE6;--card:#FFFDFB;--line:#E9D9D0;--ink:#2F2326;--soft:#6E5C5F;--rose:#B24A5E;--rose-soft:#F6DDE1;--plum:#6B4A8E;--plum-soft:#E9DFF2;--dot:rgba(178,74,94,.07)}
:root[data-theme="mystery"]{--bg:#161A28;--card:#212638;--ink:#F3ECDD;--soft:#A9A9BC;--line:#363D57;--rose:#E2B659;--rose-ink:#1E1707;--rose-soft:#3D3520;
  --sage:#8FC7A0;--sage-soft:#22382C;--honey:#E6B455;--honey-soft:#3D3319;--water:#7DBBD6;--water-soft:#1E3642;--plum:#E08AA6;--plum-soft:#43273180;--paper:#E9DBB8;--stamp:#B7352D;--dot:rgba(226,182,89,.06);--shadow:0 1px 0 rgba(0,0,0,.3)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.45}
body{min-height:100vh;overflow-x:hidden;background-image:radial-gradient(var(--dot) 1.6px,transparent 1.7px);background-size:22px 22px}
#app{overflow-x:clip;max-width:540px;margin:0 auto;padding:16px 16px calc(100px + env(safe-area-inset-bottom))}
h1,h2,h3{font-family:var(--serif);font-weight:400;margin:0;text-wrap:balance}
h1{font-size:30px;line-height:1.12} h2{font-size:21px;line-height:1.2} h3{font-size:18px;line-height:1.25}
p{margin:0}
.muted{color:var(--soft)} .small{font-size:14.5px} .tiny{font-size:13px}
.hand{font-family:var(--hand);font-size:21px;line-height:1.15}
.row{display:flex;align-items:center;gap:10px} .between{justify-content:space-between} .wrap{flex-wrap:wrap}
.stack>*+*{margin-top:12px} .gap8>*+*{margin-top:8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px;box-shadow:var(--shadow)}
.card+.card,.card+.sec,.sec+.card,.card+.ticket,.case+.card,.card+.case,.hero+.card,.hero+.case{margin-top:14px}
.sec{margin-top:24px;margin-bottom:8px}
.eyebrow{font-size:13px;color:var(--soft);font-weight:700}
.glyph{width:34px;height:34px;border-radius:11px;display:inline-grid;place-items:center;background:var(--rose-soft);color:var(--rose);flex:none}
.glyph svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.glyph.w{background:var(--water-soft);color:var(--water)} .glyph.s{background:var(--sage-soft);color:var(--sage)} .glyph.h{background:var(--honey-soft);color:var(--honey)} .glyph.p{background:var(--plum-soft);color:var(--plum)}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:48px;padding:0 18px;border-radius:15px;background:var(--rose);color:var(--rose-ink);font-weight:700;box-shadow:0 3px 0 rgba(0,0,0,.18)}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(0,0,0,.18)}
.btn.ghost{background:transparent;border:1.5px solid var(--line);color:var(--ink);box-shadow:none}
.btn.soft{background:var(--rose-soft);color:var(--ink);box-shadow:none}
.btn.sm{min-height:38px;padding:0 13px;border-radius:12px;font-size:14.5px}
.btn.block{width:100%}
.chip:active,.tabbtn:active,.quick:active{transform:scale(.96)}
.quick{flex:1;min-height:52px;border-radius:15px;font-weight:700;font-size:16px;transition:transform .12s}
.quick.p{background:var(--plum-soft);color:var(--ink)} .quick.w{background:var(--water-soft)}
.chip{display:inline-flex;align-items:center;min-height:38px;padding:0 14px;border-radius:999px;border:1.5px solid var(--line);background:var(--card);font-size:14.5px}
.chip.on{background:var(--sage-soft);border-color:var(--sage);font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.scroller{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin:0 -16px;padding-left:16px;padding-right:16px;scrollbar-width:none}
.scroller::-webkit-scrollbar{display:none} .scroller .chip{flex:none}
input,select,textarea{font:inherit;color:var(--ink);background:var(--bg);border:1.5px solid var(--line);border-radius:13px;padding:11px 12px;width:100%;min-height:46px}
textarea{min-height:76px;resize:vertical}
input:focus,select:focus,textarea:focus,button:focus-visible,a:focus-visible{outline:2.5px solid var(--rose);outline-offset:2px}
label.f{display:block;font-size:14.5px;font-weight:700;margin-bottom:5px}
.badge{display:inline-block;font-size:12.5px;font-weight:700;padding:3px 10px;border-radius:999px;background:var(--honey-soft);white-space:nowrap}
.badge.sage{background:var(--sage-soft)} .badge.water{background:var(--water-soft)} .badge.plum{background:var(--plum-soft)} .badge.rose{background:var(--rose-soft)}
.note{background:var(--honey-soft);border-radius:15px;padding:12px 14px;font-size:14.5px}
.note.sage{background:var(--sage-soft)} .note.plum{background:var(--plum-soft)}
.bar{height:12px;background:var(--line);border-radius:99px;overflow:hidden}
.bar>i{display:block;height:100%;border-radius:99px;background:var(--sage);transition:width .5s}
.list>*{display:flex;align-items:center;gap:12px;padding:11px 0;border-top:1px solid var(--line)}
.list>*:first-child{border-top:0}
.grow{flex:1;min-width:0}
.check{width:28px;height:28px;border-radius:9px;border:2px solid var(--line);flex:none;display:grid;place-items:center;font-size:16px;color:transparent;transition:background .15s}
.check.on{background:var(--sage);border-color:var(--sage);color:#fff}
.x{width:34px;height:34px;border-radius:10px;color:var(--soft);font-size:18px;flex:none}
.linkbtn{color:var(--rose);font-weight:700;text-decoration:underline;text-underline-offset:3px}
a{color:var(--rose)}
.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom));z-index:20}
.tabs>div{max-width:540px;margin:0 auto;display:flex}
.tabbtn{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;font-size:11.5px;color:var(--soft);border-radius:14px;min-height:52px;font-weight:600}
.tabbtn svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tabbtn.on{color:var(--rose);background:var(--rose-soft)}
.seg{display:flex;background:var(--line);border-radius:14px;padding:3px;gap:2px}
.seg button{flex:1;min-height:40px;border-radius:11px;font-size:13.5px;font-weight:700;color:var(--soft)}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:var(--shadow)}
.energy{display:flex;gap:6px}
.energy button{flex:1;min-height:56px;border-radius:14px;border:1.5px solid var(--line);font-size:12.5px;background:var(--card);font-weight:600}
.energy button.on{background:var(--rose-soft);border-color:var(--rose);font-weight:700}
.ringwrap{position:relative;width:112px;height:112px;flex:none}
.ringwrap svg{transform:rotate(-90deg)} .ringwrap circle{transition:stroke-dashoffset .6s}
.ringwrap .mid{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.big{font-family:var(--serif);font-size:31px;line-height:1}
.bottle{width:58px;height:112px;border:2.5px solid var(--water);border-radius:16px 16px 20px 20px;position:relative;overflow:hidden;flex:none;background:var(--card)}
.bottle i{position:absolute;left:0;right:0;bottom:0;background:var(--water);opacity:.8;transition:height .6s cubic-bezier(.3,1.4,.5,1)}
.bottle i::before{content:"";position:absolute;left:-10%;right:-10%;top:-6px;height:12px;border-radius:50%;background:var(--water)}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;align-items:end;height:96px}
.days>div{display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;gap:4px}
.days i{display:block;width:100%;border-radius:8px 8px 3px 3px;background:var(--sage);min-height:3px}
.days span{font-size:11.5px;color:var(--soft)}
.sheetbg{position:fixed;inset:0;background:rgba(20,14,28,.5);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--card);width:100%;max-width:540px;max-height:90vh;overflow:auto;border-radius:24px 24px 0 0;padding:18px 16px calc(22px + env(safe-area-inset-bottom));animation:up .22s ease-out}
@keyframes up{from{transform:translateY(30px);opacity:.4}}
.grab{width:40px;height:4px;border-radius:9px;background:var(--line);margin:0 auto 12px}
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:11px 16px;border-radius:14px;font-size:14.5px;z-index:60;max-width:88vw;text-align:center;font-weight:600}
details{border-top:1px solid var(--line);padding:11px 0}
details:first-of-type{border-top:0}
summary{font-weight:700;cursor:pointer;list-style:none;display:flex;justify-content:space-between;gap:10px}
summary::-webkit-details-marker{display:none}
summary::after{content:"+";color:var(--soft);font-weight:400;font-size:20px;line-height:1}
details[open] summary::after{content:"–"}
.ob{min-height:calc(100vh - 40px);display:flex;flex-direction:column}
.ob .foot{margin-top:auto;padding-top:20px}
.dots{display:flex;gap:6px}.dots i{width:22px;height:5px;border-radius:9px;background:var(--line)}.dots i.on{background:var(--rose)}
.cow{flex:none;display:block}
ol.how{margin:0;padding-left:20px}ol.how li+li{margin-top:7px}

/* hero: sky, hills and the cow */
.hero{position:relative;border-radius:24px;overflow:hidden;min-height:216px;padding:16px 16px 0;color:#2A2233;box-shadow:var(--shadow)}
.hero.morning{background:linear-gradient(#BFD9F2,#FCE3C4 78%)} .hero.day{background:linear-gradient(#9CCBEE,#DDF0FA 80%)}
.hero.evening{background:linear-gradient(#8E86C9,#F6BFA0 80%)} .hero.night{background:linear-gradient(#1B1C3D,#3A3470 85%);color:#F4EEFF}
.hero .hills{position:absolute;left:0;right:0;bottom:0;width:100%;height:170px;pointer-events:none}
.hero .txt{position:relative;max-width:60%;padding-bottom:18px}
.hero h1{font-size:29px}
.hero .cowwrap{position:absolute;right:6px;bottom:8px;display:flex;flex-direction:column;align-items:center}
.hero .cowbtn{transform-origin:50% 90%}
.hero .cowbtn.boop{animation:boop .7s}
@keyframes boop{20%{transform:rotate(-9deg) translateY(-8px)}45%{transform:rotate(7deg)}70%{transform:rotate(-4deg)}}
.hero .gear{position:absolute;top:12px;right:12px;width:40px;height:40px;border-radius:13px;background:rgba(255,255,255,.55);display:grid;place-items:center;color:#2A2233}
.hero .gear svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round}
.bubble{position:relative;display:inline-block;margin-top:10px;background:rgba(255,255,255,.93);color:#2A2233;border-radius:16px 16px 16px 4px;padding:7px 12px;max-width:100%}
.nametag{position:relative;margin-top:-8px;background:#fff;color:#2A2233;font-size:12px;font-weight:700;padding:2px 9px;border-radius:99px;border:1.5px solid #2A2233}

/* case file */
.case{position:relative;background:var(--paper);color:#2B2233;border-radius:6px 18px 18px 18px;padding:16px;margin-top:30px;box-shadow:var(--shadow);border:1px solid rgba(0,0,0,.08)}
.case::before{content:attr(data-tab);position:absolute;left:-1px;top:-23px;height:24px;padding:3px 14px 0;background:var(--paper);border-radius:10px 14px 0 0;font-size:12.5px;font-weight:700;border:1px solid rgba(0,0,0,.08);border-bottom:0}
.case h2{font-size:22px;max-width:78%}
.clues{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.clue{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.6);border:1.5px dashed rgba(43,34,51,.35);border-radius:12px;padding:8px 10px;font-size:13.5px;font-weight:600;min-height:46px}
.clue.on{background:#fff;border-style:solid;border-color:#3F7A57}
.clue b{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;flex:none;font-size:13px;background:rgba(43,34,51,.12)}
.clue.on b{background:#3F7A57;color:#fff}
.stamp{position:absolute;right:10px;top:10px;transform:rotate(9deg);border:3px solid var(--stamp);color:var(--stamp);font-family:var(--serif);font-size:15px;line-height:1.05;padding:5px 9px;border-radius:8px;text-align:center;letter-spacing:.04em;opacity:.9;animation:thud .35s cubic-bezier(.2,1.6,.4,1)}
@keyframes thud{from{transform:rotate(9deg) scale(2.2);opacity:0}}

/* tickets for routines */
.ticket{display:flex;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);margin-top:10px;position:relative;overflow:hidden}
.ticket .main{flex:1;padding:14px 14px 14px 16px;min-width:0}
.ticket .stub{width:84px;flex:none;display:grid;place-content:center;text-align:center;border-left:2px dashed var(--line);background:var(--rose-soft);position:relative}
.ticket .stub::before,.ticket .stub::after{content:"";position:absolute;left:-10px;width:18px;height:18px;border-radius:50%;background:var(--bg);border:1px solid var(--line)}
.ticket .stub::before{top:-10px}.ticket .stub::after{bottom:-10px}
.ticket .stub b{font-family:var(--serif);font-size:30px;font-weight:400;line-height:1}
.ticket.stretch .stub{background:var(--sage-soft)} .ticket.breath .stub{background:var(--water-soft)}

/* sticker book + theme swatches */
.stickers{display:grid;grid-template-columns:repeat(4,1fr);gap:10px 6px;text-align:center}
.stickers span{display:block;font-size:11.5px;line-height:1.2;margin-top:2px;color:var(--soft);font-weight:600}
.sticker{filter:drop-shadow(0 2px 0 rgba(0,0,0,.12))} .sticker.locked{filter:none;opacity:.7}
.swatches{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.swatch{display:flex;align-items:center;gap:10px;padding:10px;border-radius:14px;border:2px solid var(--line);background:var(--card);font-size:14px;font-weight:700;text-align:left}
.swatch.on{border-color:var(--rose)}
.swatch i{display:flex;flex:none;border-radius:9px;overflow:hidden;border:1px solid rgba(0,0,0,.15)} .swatch i b{width:13px;height:30px}
.mugs{display:flex;gap:4px;flex-wrap:wrap;align-items:center}
.mugs .glyph{width:28px;height:28px;border-radius:9px} .mugs .glyph svg{width:17px;height:17px}

/* workout player */
.player{position:fixed;inset:0;background:var(--bg);z-index:50;display:flex;flex-direction:column;padding:18px 18px calc(22px + env(safe-area-inset-bottom));max-width:540px;margin:0 auto}
.clock{font-family:var(--serif);font-size:88px;line-height:1;font-variant-numeric:tabular-nums;text-align:center}
.stepname{font-family:var(--serif);font-size:28px;text-align:center;line-height:1.15;text-wrap:balance}
.stage{height:150px;position:relative;display:grid;place-items:end center}
.stage .tramp{position:absolute;bottom:0;left:50%;transform:translateX(-50%)}
.stage .hop{position:absolute;bottom:34px;left:50%;margin-left:-48px;animation:hop .55s cubic-bezier(.3,0,.7,1) infinite alternate}
.stage.stretch .hop{bottom:8px;animation:sway 3.2s ease-in-out infinite alternate}
@keyframes hop{to{transform:translateY(-34px)}}
@keyframes sway{from{transform:rotate(-7deg)}to{transform:rotate(7deg)}}
.stage .mat{transform-origin:50% 50%;animation:squish .55s cubic-bezier(.3,0,.7,1) infinite alternate}
@keyframes squish{from{transform:scaleY(1.5)}to{transform:scaleY(1)}}
.stage.paused *{animation-play-state:paused!important}
.lung{width:120px;height:120px;border-radius:50%;background:var(--water-soft);border:3px solid var(--water);margin:0 auto 14px}
.lung.in{animation:lin 4s linear forwards}.lung.out{animation:lout 6s linear forwards}
@keyframes lin{from{transform:scale(.55)}to{transform:scale(1.1)}}@keyframes lout{from{transform:scale(1.1)}to{transform:scale(.55)}}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:70;overflow:hidden}
.confetti i{position:absolute;top:-20px;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(105vh) rotate(540deg)}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div id="app"></div>
<nav class="tabs" id="tabs" hidden><div></div></nav>
<div id="overlay"></div>
<script src="data.js"></script>
<script src="art.js"></script>
<script src="app.js"></script>
</body>
</html>
